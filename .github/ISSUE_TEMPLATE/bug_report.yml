name: Bug Report
description: Report a problem or unexpected behavior
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the issue
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can this issue be reproduced?

  - type: textarea
    id: blender
    attributes:
      label: Blender Version
      description: Example: Blender 4.2
